openapi: 3.0.3
info:
  title: AML Name Origin Classifier API
  version: 1.0.0
  description: |
    Microservice for predicting country of origin from person names.
    
    **Purpose**: Assists AML compliance teams in sanctions screening by providing 
    name origin predictions to improve match accuracy.
    
    **Important**: This service provides suggestions only. NEVER use as sole 
    risk assessment factor. Always combine with KYC, document verification, 
    and transaction monitoring.
    
    **Architecture**: Stateless microservice designed for on-premise deployment
    in enterprise data centers with limited internet access.
    
  contact:
    name: AML Compliance Technology Team
    email: aml-tech@example.com
  license:
    name: Internal Use Only
    url: https://internal.example.com/licenses

servers:
  - url: https://aml-name-classifier.internal.example.com/v1
    description: Production (Data Center 1 - Primary)
  - url: https://aml-name-classifier-dc2.internal.example.com/v1
    description: Production (Data Center 2 - Secondary)
  - url: https://aml-name-classifier-uat.internal.example.com/v1
    description: UAT Environment
  - url: http://localhost:5050
    description: Local Development

tags:
  - name: health
    description: Service health and monitoring endpoints
  - name: classification
    description: Name origin classification operations
  - name: metadata
    description: Model metadata and versioning

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /health:
    get:
      summary: Health Check
      description: Returns service health status for load balancer probes
      operationId: getHealth
      tags:
        - health
      security: []  # No auth required for health checks
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                service: AML Name Origin Classifier
                timestamp: '2026-01-06T12:34:56.789Z'
                version: '1.0.0'
                model_version: '2024.12.01'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health/ready:
    get:
      summary: Readiness Check
      description: Returns readiness status (models loaded, dependencies available)
      operationId: getReadiness
      tags:
        - health
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                  checks:
                    type: object
                    properties:
                      models_loaded:
                        type: boolean
                      database_accessible:
                        type: boolean
        '503':
          description: Service not ready

  /health/live:
    get:
      summary: Liveness Check
      description: Returns liveness status for Kubernetes/container orchestration
      operationId: getLiveness
      tags:
        - health
      security: []
      responses:
        '200':
          description: Service is alive
        '503':
          description: Service should be restarted

  /api/classify:
    post:
      summary: Classify Single Name
      description: |
        Classify a person's name to predict country of origin.
        
        Returns ranked list of countries with confidence scores.
        Uses ensemble approach: n-gram (40%), pattern (30%), phonetic (20%), database (10%).
      operationId: classifyName
      tags:
        - classification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
            examples:
              polish_name:
                summary: Polish name
                value:
                  first_name: Michał
                  last_name: Kowalski
                  request_id: req-12345-abc
              russian_name:
                summary: Russian name
                value:
                  first_name: Vladimir
                  last_name: Putin
                  request_id: req-67890-def
              multicultural_name:
                summary: Multicultural name
                value:
                  first_name: Mary
                  last_name: Wang
                  request_id: req-11111-ghi
      responses:
        '200':
          description: Classification successful
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Request tracking ID for auditability
            X-Model-Version:
              schema:
                type: string
              description: Model version used for this prediction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'
              examples:
                distinctive_origin:
                  summary: Distinctive origin (high confidence)
                  value:
                    success: true
                    query:
                      first_name: Vladimir
                      last_name: Putin
                    results:
                      - - Russia
                        - 0.98
                    confidence: 0.98
                    explanation: Ensemble classification with database match boost for Russia
                    method: ensemble_with_database
                    request_id: req-67890-def
                    model_version: '2024.12.01'
                    processing_time_ms: 8.5
                multiple_origins:
                  summary: Multiple plausible origins
                  value:
                    success: true
                    query:
                      first_name: John
                      last_name: Smith
                    results:
                      - - US
                        - 0.85
                      - - UK
                        - 0.81
                    confidence: 0.85
                    explanation: 'Ensemble: n-gram (40%), pattern (30%), phonetic (20%), db (10%)'
                    method: ensemble_classification
                    request_id: req-12345-abc
                    model_version: '2024.12.01'
                    processing_time_ms: 7.2
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Both 'first_name' and 'last_name' are required
                error_code: INVALID_REQUEST
                request_id: req-99999-err
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Request limit per time window
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Requests remaining in current window
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when rate limit resets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/batch:
    post:
      summary: Batch Classification
      description: |
        Classify multiple names in a single request.
        
        Maximum 1000 names per batch. For larger volumes, split into multiple requests.
      operationId: batchClassify
      tags:
        - classification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            example:
              names:
                - first_name: John
                  last_name: Smith
                - first_name: Vladimir
                  last_name: Putin
                - first_name: José
                  last_name: García
              request_id: batch-12345-xyz
      responses:
        '200':
          description: Batch classification successful
          headers:
            X-Request-ID:
              schema:
                type: string
            X-Model-Version:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Invalid batch request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Maximum 1000 names per batch
                error_code: BATCH_SIZE_EXCEEDED
        '429':
          description: Rate limit exceeded

  /api/version:
    get:
      summary: Get Service Version and Model Info
      description: Returns API version, model version, and supported features
      operationId: getVersion
      tags:
        - metadata
      security: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              example:
                version: 1.0.0
                service: AML Name Origin Classifier PoC
                model_version: '2024.12.01'
                description: Multi-stage pipeline for predicting country of origin from person names
                countries_supported:
                  - US
                  - UK
                  - Poland
                  - Russia
                  - Germany
                  - France
                  - Spain
                  - Italy
                  - China
                  - Arab
                features:
                  - n-gram probability models
                  - linguistic pattern matching
                  - phonetic analysis
                  - database lookup with fuzzy matching
                  - confidence scoring
                  - batch processing

  /api/metrics:
    get:
      summary: Prometheus Metrics
      description: Exports metrics in Prometheus format for monitoring
      operationId: getMetrics
      tags:
        - health
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP aml_classifier_requests_total Total number of classification requests
                # TYPE aml_classifier_requests_total counter
                aml_classifier_requests_total{method="classify",status="success"} 12547
                
                # HELP aml_classifier_request_duration_seconds Request duration in seconds
                # TYPE aml_classifier_request_duration_seconds histogram
                aml_classifier_request_duration_seconds_bucket{le="0.005"} 8234
                aml_classifier_request_duration_seconds_bucket{le="0.010"} 11890
                aml_classifier_request_duration_seconds_bucket{le="0.025"} 12500
                
                # HELP aml_classifier_confidence_score Distribution of confidence scores
                # TYPE aml_classifier_confidence_score histogram
                aml_classifier_confidence_score_bucket{le="0.5"} 234
                aml_classifier_confidence_score_bucket{le="0.7"} 1456
                aml_classifier_confidence_score_bucket{le="0.9"} 8901

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by enterprise IAM system
    
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service authentication

  schemas:
    ClassifyRequest:
      type: object
      required:
        - first_name
        - last_name
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Person's first name
          example: Vladimir
        last_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Person's last name
          example: Putin
        request_id:
          type: string
          maxLength: 100
          description: Optional client-provided request ID for tracing
          example: req-12345-abc

    ClassifyResponse:
      type: object
      required:
        - success
        - query
        - results
        - confidence
      properties:
        success:
          type: boolean
          description: Indicates if classification was successful
        query:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
        results:
          type: array
          description: Ranked list of country predictions with confidence scores
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              oneOf:
                - type: string
                - type: number
          example:
            - - Russia
              - 0.98
            - - Ukraine
              - 0.72
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score of top prediction
        explanation:
          type: string
          description: Human-readable explanation of classification method
        method:
          type: string
          enum:
            - ensemble_classification
            - ensemble_with_database
          description: Classification method used
        request_id:
          type: string
          description: Request tracking ID
        model_version:
          type: string
          description: Model version used for classification
        processing_time_ms:
          type: number
          format: float
          description: Processing time in milliseconds

    BatchRequest:
      type: object
      required:
        - names
      properties:
        names:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required:
              - first_name
              - last_name
            properties:
              first_name:
                type: string
                minLength: 1
                maxLength: 100
              last_name:
                type: string
                minLength: 1
                maxLength: 100
        request_id:
          type: string
          maxLength: 100

    BatchResponse:
      type: object
      required:
        - success
        - count
        - results
      properties:
        success:
          type: boolean
        count:
          type: integer
          description: Number of names processed
        results:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              origins:
                type: array
                items:
                  type: array
                  items:
                    oneOf:
                      - type: string
                      - type: number
              confidence:
                type: number
              error:
                type: string
                description: Error message if individual classification failed
        request_id:
          type: string
        model_version:
          type: string
        processing_time_ms:
          type: number

    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        model_version:
          type: string
        uptime_seconds:
          type: integer

    VersionResponse:
      type: object
      required:
        - version
        - service
      properties:
        version:
          type: string
          description: API version
        service:
          type: string
        model_version:
          type: string
          description: Currently loaded model version
        description:
          type: string
        countries_supported:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: string
          description: Human-readable error message
        error_code:
          type: string
          description: Machine-readable error code
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_REQUIRED
            - AUTHORIZATION_FAILED
            - RATE_LIMIT_EXCEEDED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
            - BATCH_SIZE_EXCEEDED
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time

