services:
  aml-name-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aml-name-classifier
    ports:
      - "5050:5050"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
